<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMISE - Релизы</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/music.css">
    <link rel="stylesheet" href="styles/mobile.css">
    <script src="https://music.yandex.ru/api/audio/dist/index.js"></script>
</head>
<body>
  <div class="noise-overlay"></div>
    <a id="home-switch-btn" class="home-switch-btn" title="На главный экран">
      <svg width="80" height="100" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Основной корпус кнопки -->
        <rect x="22" y="2" width="56" height="96" rx="6" fill="#222" stroke="#444" stroke-width="3"/>
        <!-- Углубление для рычага -->
        <rect x="27" y="10" width="46" height="80" rx="4" fill="#181818" stroke="#111" stroke-width="2"/>
        <!-- Индикаторы -->
        <circle class="indicator-on" cx="12" cy="35" r="4" fill="#3fff3c" filter="drop-shadow(0 0 2px #3fff3c)"/>
        <circle class="indicator-off" cx="12" cy="65" r="4" fill="#ff3b3b" filter="drop-shadow(0 0 2px #ff3b3b)"/>
        <!-- Группа рычага -->
        <g class="switch-lever-group">
          <rect class="switch-lever" x="27" y="10" width="46" height="40" rx="4" fill="#333" stroke="#222" stroke-width="2"/>
          <!-- Блики на рычаге -->
          <rect x="29" y="12" width="42" height="2" rx="1" fill="#444" opacity="0.5"/>
          <rect x="29" y="46" width="42" height="2" rx="1" fill="#222" opacity="0.5" class="switch-lever"/>
          <!-- Текст -->
          <text x="50" y="32" text-anchor="middle" font-size="22" font-family="Arial" fill="#fff" font-weight="bold">I</text>
          <text x="50" y="82" text-anchor="middle" font-size="22" font-family="Arial" fill="#fff" font-weight="bold">O</text>
        </g>
      </svg>
    </a>
    <nav class="main-nav">
        <div class="nav-links">
            <a href="music.html" class="nav-link active">РЕЛИЗЫ</a>
            <a href="artists.html" class="nav-link">АРТИСТЫ</a>
            <a href="work.html" class="nav-link">СОТРУДНИЧЕСТВО</a>
            <a href="contacts.html" class="nav-link">КОНТАКТЫ</a>
        </div>
    </nav>

    <main class="content music-content">
        <div class="vhs-player">
            <div class="vhs-top">
                <div class="vhs-brand">INMISE AUDIO</div>
                <div class="vhs-model">MODEL VHS-2024</div>
            </div>
            
            <div class="vhs-screen">
                <div class="vhs-select-wrapper">
                    <select id="artist-selector" class="vhs-select">
                        <option value="" disabled selected>ВЫБЕРИТЕ АРТИСТА</option>
                        <option value="website">СЛУШАТЬ НА САЙТЕ</option>
                        <option value="hahahap">HAHAHAP</option>
                        <option value="kodik">KODIK</option>
                        <option value="shibvri">SHIBVRI</option>
                        <option value="dope">DOPE THE PRODUCER</option>
                        <option value="xan">XAN</option>
                        <option value="namusorill">NAMUSORILL</option>
                        <option value="febb">FEBB TUFOE</option>
                    </select>
                </div>
                
                <div class="vhs-display">
                    <div class="ready-indicator">
                        <span class="ready-text">READY</span>
                        <div class="ready-dot"></div>
                    </div>
                    <div id="track-display" class="track-display">
                        <div class="no-selection-message">
                            ВСТАВЬТЕ КАССЕТУ
                            <div class="blink-cursor">_</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="vhs-controls">
                <div class="control-buttons">
                    <button class="vhs-btn" id="prev-btn">◄◄</button>
                    <button class="vhs-btn" id="play-btn">►</button>
                    <button class="vhs-btn" id="stop-btn">■</button>
                    <button class="vhs-btn" id="next-btn">►►</button>
                </div>
                <div class="vhs-indicators">
                    <div class="indicator" data-type="power">
                        <div class="indicator-light"></div>
                        <span>POWER</span>
                    </div>
                    <div class="indicator" data-type="play">
                        <div class="indicator-light"></div>
                        <span>PLAY</span>
                    </div>
                    <div class="indicator" data-type="rec">
                        <div class="indicator-light"></div>
                        <span>REC</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/app.js"></script>
    <script src="scripts/music.js"></script>
</body>
</html>
