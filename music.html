<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050605">
  <title>INMISE — Releases</title>
  <link rel="stylesheet" href="styles/releases-vhs.css">
</head>
<body class="releases-page">
  <main class="vhs-console" aria-label="INMISE releases archive">
    <img
      class="approved-console-art"
      src="assets/ui/releases-console-approved.png"
      alt=""
      aria-hidden="true"
    >

    <header class="console-header">
      <a class="console-brand" href="index.html" aria-label="INMISE home">INMISE</a>
      <nav class="console-nav" aria-label="Main navigation">
        <a class="console-nav__item is-active" href="music" data-label="RELEASES">RELEASES</a>
        <a class="console-nav__item" href="artists" data-label="ARTISTS">ARTISTS</a>
        <a class="console-nav__item" href="work" data-label="COLLABORATION">COLLABORATION</a>
        <a class="console-nav__item" href="contacts" data-label="CONTACTS">CONTACTS</a>
      </nav>
    </header>

    <section class="signal-stage" aria-live="polite">
      <img class="artist-visual" id="artist-visual" alt="" hidden>
      <div class="crt-message" id="crt-message" aria-hidden="true">
        <span class="crt-message__led"></span>
        <strong>READY FOR INPUT</strong>
        <p>SELECT AN ARTIST CASSETTE</p>
      </div>
      <div class="clip-stage" id="clip-stage" hidden>
        <video id="clip-video" controls playsinline preload="metadata">
          <source src="assets/videos/background.mp4" type="video/mp4">
        </video>
        <button class="clip-stage__return" id="clip-return" type="button">RETURN TO ARCHIVE</button>
      </div>
    </section>

    <aside class="track-console" aria-label="Artist releases">
      <label class="artist-picker has-tape is-placeholder" for="artist-selector">
        <span class="artist-picker__legend">ARTIST CASSETTE</span>
        <span class="cassette-mouth" aria-hidden="true">
          <span class="cassette-door"><strong id="cassette-door-label">SELECT ARTIST</strong></span>
          <span class="artist-cassette" id="artist-cassette">
            <img src="assets/ui/releases-cassette-approved.png" alt="">
            <strong id="cassette-artist-name">SELECT ARTIST</strong>
          </span>
        </span>
        <select id="artist-selector" aria-label="Select artist cassette">
          <option value="" selected>SELECT ARTIST</option>
          <option value="hahahap">HAHAHAP</option>
          <option value="kodik">KODIK</option>
          <option value="shibvri">SHIBVRI</option>
          <option value="dope">DOPE THE PRODUCER</option>
          <option value="xan">XAN</option>
          <option value="namusorill">NAMUSORILL</option>
          <option value="febb">FEBB TUFOE</option>
        </select>
        <span class="screen-status" id="deck-status">STANDBY</span>
      </label>

      <section class="track-archive" aria-label="Yandex Music track archive">
        <span class="track-archive__legend">TRACK ARCHIVE</span>
        <div class="track-console__empty" id="track-console-empty">
          <span>TRACK LIBRARY</span>
          <strong>NO TAPE</strong>
        </div>
        <div class="widget-loader" id="widget-loader" hidden>LOADING TAPE…</div>
        <div class="widget-stage" id="widget-stage"></div>
      </section>
    </aside>

    <section class="control-deck" aria-label="VHS control deck">
      <button
        class="volume-knob"
        id="volume-knob"
        type="button"
        role="slider"
        aria-label="Clip volume"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="72"
      ><output id="volume-value">72</output></button>

      <div class="deck-transport">
        <button type="button" class="transport-btn" data-deck-action="rew" aria-label="Previous artist"><span class="transport-btn__cap" aria-hidden="true"></span></button>
        <button type="button" class="transport-btn" data-deck-action="play" aria-label="Load random artist"><span class="transport-btn__cap" aria-hidden="true"></span></button>
        <button type="button" class="transport-btn" data-deck-action="stop" aria-label="Stop and eject artist cassette"><span class="transport-btn__cap" aria-hidden="true"></span></button>
        <button type="button" class="transport-btn" data-deck-action="ff" aria-label="Next artist"><span class="transport-btn__cap" aria-hidden="true"></span></button>
      </div>

      <div class="tape-readout" aria-label="Tape counter">
        <span class="signal-mode" id="signal-mode">STANDBY</span>
        <canvas class="signal-waveform" id="signal-waveform" aria-hidden="true"></canvas>
        <strong id="tape-counter">00:00:00</strong>
      </div>

      <button type="button" class="clip-button" id="clip-button" aria-label="Play clip">
        <span class="clip-button__cap" aria-hidden="true"></span>
        <span>PLAY CLIP</span>
      </button>
    </section>
  </main>

  <script src="scripts/releases-vhs.js"></script>
</body>
</html>
