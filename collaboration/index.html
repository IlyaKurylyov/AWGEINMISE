<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030403">
  <title>INMISE — Collaboration</title>
  <link rel="stylesheet" href="/styles/work.css">
  <link rel="stylesheet" href="/styles/console-home.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/scripts/config.local.js" defer></script>
  <script src="/scripts/config.js" defer></script>
  <script src="/scripts/work-dynamic.js" defer></script>
</head>
<body class="collaboration-page">
  <main class="collaboration-console" aria-label="INMISE collaboration tape market">
    <img
      class="collaboration-console__art collaboration-console__art--desktop"
      src="/assets/ui/collaboration-console-approved.png"
      alt=""
      aria-hidden="true"
    >
    <img
      class="collaboration-console__art collaboration-console__art--mobile"
      src="/assets/ui/collaboration-console-mobile-approved.png"
      alt=""
      aria-hidden="true"
    >

    <a class="console-home" href="/" aria-label="Return to master terminal">
      <i aria-hidden="true"></i><span>MASTER</span>
    </a>

    <nav class="console-nav" aria-label="Main navigation">
      <a class="console-nav__item" href="/releases/" data-label="RELEASES">RELEASES</a>
      <a class="console-nav__item" href="/artists/" data-label="ARTISTS">ARTISTS</a>
      <a class="console-nav__item is-active" href="/collaboration/" data-label="COLLABORATION" aria-current="page">COLLABORATION</a>
      <a class="console-nav__item" href="/contacts/" data-label="CONTACTS">CONTACTS</a>
    </nav>

    <fieldset class="producer-bank" aria-label="Select producer">
      <legend class="sr-only">Select producer</legend>
      <label class="producer-toggle producer-toggle--dope">
        <input type="checkbox" value="@DopeTheProduce">
        <span class="producer-toggle__lamp" aria-hidden="true"></span>
        <span class="producer-toggle__name">@DOPE<br>THE PRODUCER</span>
        <span class="producer-toggle__lever" aria-hidden="true"></span>
      </label>
      <label class="producer-toggle producer-toggle--shibvri">
        <input type="checkbox" value="@SHIBVRI">
        <span class="producer-toggle__lamp" aria-hidden="true"></span>
        <span class="producer-toggle__name">@SHIBVRI</span>
        <span class="producer-toggle__lever" aria-hidden="true"></span>
      </label>
      <label class="producer-toggle producer-toggle--namusorill">
        <input type="checkbox" value="@Namusorill" checked>
        <span class="producer-toggle__lamp" aria-hidden="true"></span>
        <span class="producer-toggle__name">@NAMUSORILL</span>
        <span class="producer-toggle__lever" aria-hidden="true"></span>
      </label>
    </fieldset>

    <section class="tape-library" aria-label="Available beat tapes">
      <div class="tape-library__rows" id="tape-library-rows"></div>
      <p class="tape-library__status" id="tape-library-status" role="status">SCANNING TAPE LIBRARY…</p>
    </section>

    <section class="routing-overlay" aria-hidden="true">
      <i class="vu-needle vu-needle--input"></i>
      <i class="vu-needle vu-needle--bus"></i>
      <i class="vu-needle vu-needle--output"></i>
    </section>

    <section class="producer-readout" aria-live="polite">
      <strong id="selected-producer">@NAMUSORILL</strong>
    </section>

    <section class="price-readout" aria-live="polite">
      <strong id="selected-price">2 000 ₽</strong>
      <span>WAV 24-BIT / 48KHZ</span>
    </section>

    <a class="buy-tape" id="buy-tape" href="https://t.me/namusorill" target="_blank" rel="noopener noreferrer">
      <span class="buy-tape__cap">BUY TAPE</span>
    </a>

    <section class="transport-bank" aria-label="Tape transport">
      <button class="transport-button transport-button--prev" id="tape-prev" type="button"><span class="transport-button__cap" aria-hidden="true"></span><span class="sr-only">Previous tape</span></button>
      <button class="transport-button transport-button--play" id="tape-play" type="button"><span class="transport-button__cap" aria-hidden="true"></span><span class="sr-only">Play selected tape</span></button>
      <button class="transport-button transport-button--stop" id="tape-stop" type="button"><span class="transport-button__cap" aria-hidden="true"></span><span class="sr-only">Stop tape</span></button>
      <button class="transport-button transport-button--next" id="tape-next" type="button"><span class="transport-button__cap" aria-hidden="true"></span><span class="sr-only">Next tape</span></button>
    </section>

    <div class="waveform-monitor" id="waveform-monitor" aria-hidden="true"></div>
    <time class="tape-counter" id="tape-counter">00:00:00:00</time>
    <audio id="tape-audio" preload="metadata"></audio>
  </main>
</body>
</html>
