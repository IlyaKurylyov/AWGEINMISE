<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INMISE — Admin</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/work.css">
  <link rel="stylesheet" href="styles/responsive.css">
  <link rel="stylesheet" href="styles/desktop-protection.css">
  <link rel="stylesheet" href="styles/admin-responsive.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Share+Tech+Mono&family=VT323&display=swap');

    /* Admin page reset to avoid mobile overflow */
    .page-admin, .page-admin * { box-sizing: border-box; }

    :root{
      --vhs-bg-top:#1A1A1A;            /* фон сверху */
      --vhs-bg-bottom:#2B2A28;         /* фон снизу */
      --vhs-text:#D6D3C5;              /* тёплый текст */
      --vhs-amber:#FFB84C;             /* янтарная подсветка */
      --vhs-green:#7FFF7F;             /* индикаторы актив */
      --vhs-rec:#E74C3C;               /* красная запись */
      --vhs-border:#3A3A3A;            /* бортики */
      --vhs-shadow:0 8px 24px rgba(0,0,0,.6);
    }

    body.page-admin{
      font-family: 'IBM Plex Mono', 'Share Tech Mono', monospace;
      color: var(--vhs-text);
      background: radial-gradient(circle at center, #141312 0%, #0A0A0A 100%);
      background-attachment: fixed;
      filter: sepia(0.25) contrast(1.05) brightness(0.95);
      box-shadow: inset 0 0 80px rgba(0,0,0,0.6);
      overflow: hidden; /* lock outer scroll */
    }
    body.page-admin::before{ content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.025) 3px, transparent 4px); opacity:0.10; }
    body.page-admin::after{ content:""; position:fixed; inset:0; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%); pointer-events:none; z-index:9998; }
    .admin-wrap { width: 100%; height: 100vh; margin: 0; padding: 0; position: relative; background: linear-gradient(to bottom, #1E1D1B, #191816); border: 1px solid #3A3936; border-radius: 2px; box-shadow: inset 0 0 120px rgba(0,0,0,0.7), 0 0 24px rgba(0,0,0,0.5); box-sizing: border-box; }
    .admin-wrap::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 3px, rgba(255,255,255,.018) 4px, transparent 5px); opacity: 0.04; mix-blend-mode: overlay; pointer-events: none; border-radius: 2px; }
    .admin-card { background: linear-gradient(to bottom, #2C2B28, #1A1917); border:1px solid #3D3C38; border-radius:2px; padding:16px; margin-bottom:20px; position:relative; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.6), 0 0 8px rgba(0,0,0,0.8); }
    .admin-card::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.018) 3px, transparent 4px); opacity:0.04; mix-blend-mode:overlay; pointer-events:none; border-radius:2px; }
    .admin-card:hover { 
      transform: translateY(-1px);
    }
    .admin-grid { display:grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; height: 100%; width:100%; column-gap: 2px; row-gap: 0; }
    .admin-grid .admin-card { margin:0; }
    .admin-card { min-width: 0; }
    .content.main { box-shadow: inset 0 0 80px rgba(0,0,0,0.8); }
    .panel { height: 100%; width:100%; overflow: auto; display: block; min-width: 0; }
    .admin-header { display: none; }
    .admin-h { margin:0 0 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--vhs-text); text-shadow: 0 1px 0 #000; }
    .admin-label { display:block; margin:10px 0 6px; color:rgba(255,255,255,0.8); }
    .admin-input, .admin-textarea { width:100%; background: linear-gradient(180deg,#242321,#1A1A19); border:1px solid var(--vhs-border); color:var(--vhs-text); padding:10px 12px; border-radius:2px; box-shadow: inset 1px 1px 0 rgba(255,255,255,0.06), inset -1px -1px 0 rgba(0,0,0,0.7); transition: box-shadow .18s, border .18s, background .18s; }
    .admin-input:focus, .admin-textarea:focus { outline: none; border-color: #5c5c5c; box-shadow: 0 0 6px rgba(255,184,76,0.3), inset 1px 1px 0 rgba(255,255,255,0.1); }
    .admin-textarea { min-height: 120px; resize: vertical; font-family: 'VT323', monospace; font-size:16px; line-height:1.4; background: #1A1A1A; }
    /* ОПИСАНИЕ в 3 раза меньше по высоте */
    #p-desc.admin-textarea { min-height: 40px; }
    .admin-row { display:flex; gap:10px; }
    .admin-row > * { flex: 1; }
    .admin-actions { display:flex; gap:10px; justify-content:flex-end; margin-top: 8px; }
    .admin-btn { padding:12px 18px; border-radius:2px; border:1px solid #2C2C2C; background: linear-gradient(to bottom, #2F2F2F, #1E1E1E); color:#D6D3C5; cursor:pointer; font-weight:900; letter-spacing:.06em; text-transform:uppercase; box-shadow: inset 0 0 3px rgba(0,0,0,0.6); transition: transform .1s; }
    .admin-btn:hover { filter: brightness(1.03); }
    .admin-btn:active { transform: translateY(1px); box-shadow: inset 0 0 2px rgba(0,0,0,0.8); }
    .admin-btn.primary { background: linear-gradient(180deg,#f0a7a0,#b2544c); color:#2b100f; border-color:#8a3a33; }
    .admin-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; }

    /* Логин в шапке админки */
    .auth-panel { position:static; display:flex; align-items:center; gap:10px; }
    .auth-btn { background: linear-gradient(180deg,#2a2a29,#1c1c1c); color:var(--vhs-text); border:2px solid var(--vhs-border); padding:8px 12px; border-radius:8px; cursor:pointer; text-decoration:none; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.7); }
    .auth-btn:hover { filter: brightness(1.05); }

    /* Простая модалка для логина по паролю */
    .auth-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:300; }
    .auth-modal { background:#0b0b0b; border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:16px; width:min(420px,92vw); color:#fff; }
    .auth-modal h3{margin:0 0 12px;}
    .auth-modal label{display:block; margin:8px 0 6px; color:rgba(255,255,255,0.8)}
    .auth-modal input{width:100%; background:#111; border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 10px; border-radius:8px;}
    .auth-modal .row{display:flex; gap:10px}
    .auth-modal .actions{display:flex; gap:10px; justify-content:flex-end; margin-top:12px}
    .auth-modal .actions .auth-btn{padding:8px 12px}

    /* Retro panel look */
    .page-admin .admin-card { border: 2px solid #2a2a2a; box-shadow: inset 0 0 0 1px #000, inset 0 0 24px #000a, 0 0 16px #0008; }
    .page-admin .admin-card .admin-h { font-weight:900; }
    .page-admin .admin-btn { border-width: 2px; border-color:#8d8d8d; box-shadow: inset 0 0 18px #fff2, 0 0 14px #fff2; }
    .page-admin .admin-btn.primary { background:linear-gradient(180deg,#f5f5f5,#bfbfbf); color:#111; border-color:#fff; text-shadow: none; }
    .page-admin .admin-btn.primary:hover { background:#111; color:#f5f5f5; }

    /* Avatar larger + CRT */
    .admin-avatar { width: 100%; height: 300px; position: relative; border-radius:2px; box-shadow: inset 0 0 40px rgba(0,0,0,0.45); overflow: hidden; background-color: #000; }
    .admin-avatar .side-blur { position:absolute; top:0; bottom:0; width: 0; background-image: var(--avatar-bg, none); background-size: cover; filter: blur(20px) brightness(0.88); transform: scale(1.08); z-index:0; pointer-events:none; }
    .admin-avatar .side-blur.left { left:0; background-position:center left; -webkit-mask-image: linear-gradient(to right, black, transparent 70%); mask-image: linear-gradient(to right, black, transparent 70%); }
    .admin-avatar .side-blur.right { right:0; background-position:center right; -webkit-mask-image: linear-gradient(to left, black, transparent 70%); mask-image: linear-gradient(to left, black, transparent 70%); }
    .admin-avatar img { position: relative; z-index: 1; width:100%; height:100%; object-fit: contain; border-radius:2px; border:1px solid var(--vhs-border); display:block; }
    .crt { position: relative; overflow: hidden; filter: contrast(95%) brightness(92%) sepia(0.25); }
    .crt::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 2px); opacity: 0.12; pointer-events: none; }
    .crt::after { content: ""; position: absolute; inset: 0; border-radius: 2px; box-shadow: inset 0 0 30px rgba(0,0,0,0.6); }

    /* Decorative meter */
    .admin-meter { margin-top: 10px; height: 12px; background:#0f0f0f; border:2px solid var(--vhs-border); border-radius: 8px; box-shadow: inset 0 2px 6px #000, 0 0 10px #0006; position: relative; }
    .admin-meter .fill { position:absolute; left:2px; top:2px; bottom:2px; width: 60%; border-radius:6px; background: linear-gradient(90deg,#a4782e,#ffb84c); box-shadow: 0 0 10px rgba(255,184,76,.4), inset 0 0 6px #0006; }

    .counter-hint { font-size: 12px; color: rgba(214,211,197,0.75); margin-top: 4px; text-align: right; padding-right: 6px; pointer-events: none; display:block; }

    /* Simple link modal */
    .link-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:400; }
    .link-modal { background:#0b0b0b; border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:16px; width:min(420px,92vw); color:#fff; }
    .link-modal h3{margin:0 0 12px;}
    .link-modal label{display:block; margin:8px 0 6px; color:rgba(255,255,255,0.8)}
    .link-modal input{width:100%; background:#111; border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 10px; border-radius:8px;}
    .link-modal .actions{display:flex; gap:10px; justify-content:flex-end; margin-top:12px}
    .link-modal .actions .auth-btn{padding:8px 12px}

    /* Beat rows */
    .beat-row { display:flex; flex-direction:column; gap:8px; }
    .beat-row-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .audio-wrap { background: linear-gradient(180deg,#1a1a1a,#121212); border:2px solid var(--vhs-border); border-radius:10px; padding:8px; box-shadow: inset 0 0 12px rgba(0,0,0,.65); }
    .audio-wrap audio { width:100%; filter: saturate(0.85) contrast(1.05) brightness(0.95); }

    /* File switch (tumbler) */
    .file-controls { display:flex; align-items:center; gap:10px; }
    .file-switch { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(180deg,#3a3936,#242321); color:var(--vhs-text); border:1px solid #3A3936; border-radius:4px; padding:10px 14px; cursor:pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.5); user-select:none; }
    .file-switch .lamp { width:14px; height:14px; border-radius:50%; background: var(--vhs-amber); opacity:.25; box-shadow: 0 0 8px rgba(255,184,76,.35); transition: opacity .12s ease; }
    .file-switch:hover .lamp, .file-switch.on .lamp { opacity:.8; }
    .file-switch:active { transform: translateY(1px); }
    .file-aux-btn { width:40px; height:36px; border:1px solid #3A3936; border-radius:4px; background: linear-gradient(180deg,#30302d,#1f1f1d); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.5); cursor:pointer; color: var(--vhs-text); display:inline-flex; align-items:center; justify-content:center; font-weight:700; letter-spacing:.06em; }
    .file-aux-btn:active { transform: translateY(1px); }

    /* Beat card + controls */
    .beat-card { background:#2A2927 !important; box-shadow: inset 0 0 6px rgba(0,0,0,0.8), 0 8px 24px rgba(0,0,0,0.5); }
    .beat-card:hover { box-shadow: inset 0 0 6px rgba(0,0,0,0.8), 0 0 10px rgba(255,184,76,0.4); }
    .analog-bar { height:10px; border-radius:8px; background:#3a3a38; border:2px solid var(--vhs-border); overflow:hidden; }
    .analog-bar .fill { height:100%; width:0%; background: linear-gradient(90deg,#4A4A42 0%, #FFB84C 100%); box-shadow: 0 0 10px rgba(255,184,76,.35) inset; }
    .btn-square { width:36px; height:32px; display:inline-flex; align-items:center; justify-content:center; background:#3B3A38; color:var(--vhs-text); border:2px solid var(--vhs-border); border-radius:6px; cursor:pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.7); }
    .btn-square:hover { box-shadow: 0 0 6px rgba(255,184,76,0.4), inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.7); }
    .btn-square:active { transform: translateY(1px); box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }

    /* New tape-like beat row */
    .tape-panel { background: linear-gradient(180deg,#2B2A27,#1C1B19); border:1px solid #3A3A36; border-radius:10px; padding:2px 56px 4px 12px; position:relative; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.6), 0 0 8px rgba(0,0,0,0.8); }
    .tape-head { display:flex; align-items:flex-start; justify-content:flex-start; gap:10px; }
    .tape-title { font-family: 'VT323', monospace; font-size: 20px; letter-spacing:.02em; color:#D8D6CE; line-height: 1; margin: 0; padding: 0; }
    .tape-controls { position:absolute; right:8px; top:4px; display:flex; flex-direction:column; gap:6px; }
    .btn-icon { width:28px; height:28px; border-radius:6px; background: linear-gradient(180deg,#2f2e2c,#1d1d1b); border:2px solid #2f2e2c; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.5); cursor:pointer; position:relative; }
    .btn-icon:hover { box-shadow: 0 0 12px rgba(255,184,76,0.55), inset 0 1px 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(0,0,0,.7); }
    .btn-icon:active { transform: translateY(1px); }
    /* Delete = cross */
    .btn-icon.eject::before, .btn-icon.eject::after { content:""; position:absolute; left:50%; top:50%; width:70%; height:2px; background:#d5d0c6; border-radius:2px; transform-origin:center; box-shadow: 0 0 2px rgba(0,0,0,.5); }
    .btn-icon.eject::before { transform: translate(-50%,-50%) rotate(45deg); }
    .btn-icon.eject::after  { transform: translate(-50%,-50%) rotate(-45deg); }
    .btn-icon.eject:hover { box-shadow: 0 0 14px rgba(231,76,60,0.7), inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.7); border-color:#8a3a33; }
    .btn-icon.eject:hover::before, .btn-icon.eject:hover::after { background:#E74C3C; box-shadow: 0 0 6px rgba(231,76,60,0.8); }
    /* Volume/Play = circular play symbol */
    .btn-icon.volume::before { content:""; position:absolute; left:50%; top:50%; width:70%; height:70%; transform: translate(-50%,-50%); border:2px solid #d5d0c6; border-radius:50%; box-shadow: 0 0 3px rgba(0,0,0,.6) inset; }
    .btn-icon.volume::after  { content:""; position:absolute; left:50%; top:50%; width:0; height:0; border-style:solid; border-width:6px 0 6px 9px; border-color: transparent transparent transparent #d5d0c6; transform: translate(-30%,-50%); filter: drop-shadow(0 0 2px rgba(0,0,0,.7)); }
    .btn-icon.volume .wave, .btn-icon.volume .wave2 { display:none; }
    .btn-icon.volume:hover { box-shadow: 0 0 16px rgba(255,184,76,0.65), inset 0 1px 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(0,0,0,.7); }
    .btn-icon.volume.on { box-shadow: 0 0 18px rgba(127,255,127,0.6), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.7); }

    .tape-meter { display:grid; grid-template-columns: 56px 1fr 56px; align-items:center; gap:10px; margin-top:2px; }
    .tape-meter .time { font-weight:900; font-size:14px; text-align:center; color:#2b2a27; background: linear-gradient(180deg,#cfc8bb,#8a8376); border:2px solid #2b2a27; border-radius:10px; padding:4px 8px; box-shadow: inset 0 2px 6px rgba(0,0,0,.45); }
    .tape-meter .track { height:10px; border-radius:10px; background: linear-gradient(180deg,#b9b3a7,#6f6a60); border:2px solid #2b2a27; box-shadow: inset 0 2px 6px rgba(0,0,0,.45); overflow:hidden; }
    .tape-meter .fill { height:100%; width:0%; background: linear-gradient(90deg,#4A4A42 0%, #FFB84C 100%); box-shadow: inset 0 0 10px rgba(0,0,0,.3); }

    /* Noise overlay + vignette */
    .page-admin .content{ position:relative; height:100vh; overflow:hidden; }
    .page-admin .content::after{ content:''; position:fixed; inset:0; pointer-events:none; background: radial-gradient(circle at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.5) 100%); z-index: 6; }

    /* Busy overlays */
    #beats-card { position: relative; overflow:auto; padding-bottom: 96px; scroll-padding-bottom: 96px; }
    #profile-card { overflow:hidden; }
    .busy-overlay { position:absolute; inset:0; background: rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index: 50; }
    .busy-overlay .busy-box { display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid #3A3A36; border-radius:8px; background: linear-gradient(180deg,#2B2A27,#1C1B19); color:#D6D3C5; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.6); font-weight:700; }
    .spinner { width:18px; height:18px; border:3px solid rgba(255,255,255,0.2); border-top-color:#FFB84C; border-radius:50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .row-busy { position: absolute; inset:0; background: rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:20; }
    .row-busy .busy-box { padding:8px 10px; font-size:12px; }

    /* ===== Unauth FL-studio styled screen ===== */
    .unauth-screen { position: fixed; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center; }
    .unauth-bg { position:absolute; inset:0; background:
      linear-gradient(180deg,#1d1c1a,#121110),
      radial-gradient(1200px 600px at 50% 0%, rgba(255,184,76,0.08), transparent 70%);
      filter: contrast(1) brightness(0.95);
    }
    .unauth-grid { position:absolute; inset:8% 6%; border:1px solid #2f2e2c; border-radius: 8px; box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 0 0 20px rgba(0,0,0,0.5); overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .unauth-grid::before { content:""; position:absolute; inset:0; background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 12px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 12px);
      opacity:0.5;
    }
    .login-panel { position: relative; z-index:3; width: min(440px, 90vw); border:1px solid #3A3A3A; border-radius: 10px; background: linear-gradient(180deg,#2B2A27,#1C1B19); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.7); padding: 18px; }
    .login-panel h3 { font-family: 'VT323', monospace; font-size: 28px; margin: 0 0 12px; color: #D6D3C5; letter-spacing: .02em; }
    .login-panel .row { display:flex; flex-direction:column; gap:10px; }
    .login-panel input { width:100%; background: linear-gradient(180deg,#242321,#1A1A19); border:1px solid #3A3A3A; color:#D6D3C5; padding:10px 12px; border-radius:6px; }
    .login-panel .actions { display:flex; justify-content:flex-end; gap:10px; margin-top: 12px; }
    .login-panel .auth-btn { background: linear-gradient(180deg,#2f2e2c,#1d1d1b); border:1px solid #3A3A3A; border-radius:6px; }
    .login-panel .auth-link { background:transparent; border:0; color:#D6D3C5; cursor:pointer; padding:4px 0; text-decoration:underline; opacity:.78; }
    .login-panel .auth-link:hover { opacity:1; }

    @keyframes adminNeon { 0%,100%{ text-shadow: 0 0 8px #fff, 0 0 24px #fff3; } 50%{ text-shadow: 0 0 16px #fff, 0 0 36px #fff5; } }

    @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/config.local.js"></script>
  <script src="scripts/config.js"></script>
</head>
<body class="page-admin">
  <div class="noise-overlay"></div>
  <div class="unauth-screen" id="unauth-screen">
    <div class="unauth-bg"></div>
    <div class="unauth-grid">
      <div class="login-panel">
        <h3>Вход</h3>
        <div class="row">
          <label>E-mail</label>
          <input id="auth-email" type="email" placeholder="you@example.com" />
        </div>
        <div class="row">
          <label>Пароль</label>
          <input id="auth-password" type="password" placeholder="••••••••" />
        </div>
        <div class="actions">
          <button class="auth-btn" id="auth-submit">Войти</button>
        </div>
        <div class="actions" id="auth-forgot-row" style="justify-content:flex-start; margin-top:8px;">
          <button class="auth-link" id="auth-forgot" type="button">Забыли пароль?</button>
        </div>
        <div id="password-reset-form" style="display:none;">
          <p id="password-reset-message" style="margin:0 0 12px; color:#D6D3C5; opacity:.85;"></p>
          <div class="row">
            <label>Новый пароль</label>
            <input id="reset-password" type="password" autocomplete="new-password" minlength="8" />
          </div>
          <div class="row">
            <label>Повторите пароль</label>
            <input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" />
          </div>
          <div class="actions">
            <button class="auth-btn" id="reset-password-submit" type="button">Сохранить пароль</button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <main class="content main" style="padding: 0;">
    <div class="link-modal-overlay" id="link-modal" aria-hidden="true">
      <div class="link-modal" role="dialog" aria-modal="true">
        <h3 id="link-modal-title">Ссылка</h3>
        <label>URL</label>
        <input id="link-input" type="text" placeholder="https://..." />
        <div class="actions">
          <button class="auth-btn" id="link-cancel">Отмена</button>
          <button class="auth-btn" id="link-save">Сохранить</button>
        </div>
      </div>
    </div>
    
    <div class="admin-wrap">
      <div class="admin-header">
        <h2 class="admin-h">Кабинет артиста</h2>
        <div style="display:flex; align-items:center; gap:12px; margin-left:auto;">
          <div id="admin-status" style="opacity:0.8"></div>
          <div class="auth-panel">
            <button id="auth-login-btn" class="auth-btn">Войти</button>
            <div id="auth-user" class="auth-user" style="display:none;"></div>
            <button id="auth-logout-btn" class="auth-btn" style="display:none;">Выйти</button>
          </div>
        </div>
      </div>

      <div class="admin-grid">
        <section class="admin-card panel" id="profile-card">
          <h3 class="admin-h">Моя карточка</h3>
          <label class="admin-label">Имя</label>
          <input id="p-name" class="admin-input" type="text" />
          <label class="admin-label">ОПИСАНИЕ</label>
          <textarea id="p-desc" class="admin-textarea"></textarea>
          <div id="p-desc-counter" class="counter-hint">0/60</div>
          <label class="admin-label">ПОДРОБНОЕ ОПИСАНИЕ</label>
          <textarea id="p-matrix" class="admin-textarea" placeholder="Текст, который показывается при клике на карточку"></textarea>
          <div id="p-matrix-counter" class="counter-hint">0/629</div>
          <label class="admin-label">Заменить фото</label>
          <div class="file-controls">
            <input id="p-image-file" type="file" accept="image/*" style="display:none;" />
            <label for="p-image-file" class="file-switch">Выберите файл <span class="lamp"></span></label>
            <button type="button" class="file-aux-btn" id="btn-tg">TG</button>
            <button type="button" class="file-aux-btn" id="btn-vk">VK</button>
            <button type="button" class="file-aux-btn" id="btn-inst">INST</button>
          </div>
          <div class="admin-avatar crt">
            <div class="side-blur left" aria-hidden="true"></div>
            <div class="side-blur right" aria-hidden="true"></div>
            <img id="p-image-preview" src="" alt="preview" style="display:none;"/>
          </div>
          <div class="photo-led"><span class="red-led" aria-hidden="true"></span></div>
          <div class="admin-actions">
            <button id="p-save" class="admin-btn primary">Сохранить</button>
          </div>
        </section>

        <section class="admin-card panel" id="beats-card">
          <h3 class="admin-h">Мои биты</h3>
          <div id="beats-list" style="display:flex; flex-direction:column; gap:10px;"></div>
          <hr style="border-color: rgba(255,255,255,0.08);"/>
          <h4 class="admin-h">Добавить бит</h4>
          <label class="admin-label">Название</label>
          <input id="b-title" class="admin-input" type="text" />
          <label class="admin-label">Файл аудио (mp3/wav)</label>
          <input id="b-file" class="admin-input" type="file" accept="audio/*" />
          <div class="admin-actions">
            <button id="b-add" class="admin-btn primary">Загрузить</button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="scripts/admin.js"></script>
</body>
</html>
