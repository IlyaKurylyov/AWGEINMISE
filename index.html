<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050706">
  <title>INMISE — Independent Audio / Video Label</title>
  <link rel="stylesheet" href="styles/home-terminal.css">
</head>
<body class="terminal-home is-booting">
  <main class="home-console" aria-label="INMISE master terminal">
    <div class="screen-well">
      <section class="master-screen" aria-labelledby="home-title">
        <video id="home-signal" muted loop playsinline preload="metadata" aria-hidden="true">
          <source src="assets/videos/background.mp4" type="video/mp4">
        </video>
        <div class="signal-shade" aria-hidden="true"></div>
        <div class="signal-noise" aria-hidden="true"></div>

        <header class="terminal-header">
          <nav class="terminal-nav" aria-label="Main navigation">
            <a href="music">RELEASES</a>
            <a href="artists">ARTISTS</a>
            <a href="work">COLLABORATION</a>
            <a href="contacts">CONTACTS</a>
          </nav>
        </header>

        <span class="screen-index screen-index--left">MASTER TERMINAL / CHANNEL 01</span>
        <span class="screen-index screen-index--right"><i></i> SIGNAL ONLINE</span>

        <div class="boot-copy">
          <span class="boot-code">INDEPENDENT AUDIO / VIDEO LABEL</span>
          <h1 id="home-title" data-text="INMISE" aria-label="INMISE — It's not me, it's someone else"><span class="logo-letter" data-echo="its-one" tabindex="0" aria-label="I — it's">I</span><span class="logo-letter" data-echo="not" tabindex="0" aria-label="N — not">N</span><span class="logo-letter" data-echo="me" tabindex="0" aria-label="M — me">M</span><span class="logo-letter" data-echo="its-two" tabindex="0" aria-label="I — it's">I</span><span class="logo-letter" data-echo="someone" tabindex="0" aria-label="S — someone">S</span><span class="logo-letter" data-echo="else" tabindex="0" aria-label="E — else">E</span></h1>
        </div>

        <div class="acronym-echoes" aria-hidden="true">
          <span class="acronym-echo acronym-echo--its-one" data-echo-id="its-one">it's</span>
          <span class="acronym-echo acronym-echo--not" data-echo-id="not">not</span>
          <span class="acronym-echo acronym-echo--me" data-echo-id="me">me</span>
          <span class="acronym-echo acronym-echo--its-two" data-echo-id="its-two">it's</span>
          <span class="acronym-echo acronym-echo--someone" data-echo-id="someone">someone</span>
          <span class="acronym-echo acronym-echo--else" data-echo-id="else">else</span>
        </div>

        <div class="screen-footer" aria-hidden="true">
          <span>PROPERTY OF INMISE</span>
          <span>NO SIGNAL IS EVER LOST</span>
        </div>
      </section>

      <picture class="bezel-layer" aria-hidden="true">
        <source
          media="(max-width: 560px) and (orientation: portrait)"
          srcset="assets/ui/home-bezel-mobile.png"
        >
        <source
          media="(max-width: 1100px) and (orientation: portrait)"
          srcset="assets/ui/home-bezel-tablet.png"
        >
        <img
          class="bezel-overlay"
          src="assets/ui/home-bezel.png"
          alt=""
        >
      </picture>

      <div class="archive-port">
        <a class="archive-handle" href="music" aria-label="Open releases archive">
          <img src="assets/ui/archive-cartridge-tight.png" alt="" aria-hidden="true">
          <span class="archive-title">OPEN ARCHIVE</span>
          <span class="archive-arrow" aria-hidden="true">▼</span>
        </a>
      </div>
    </div>

    <footer class="system-rail">
      <div class="rail-power"><i></i><span>POWER</span></div>
      <div class="signal-trace" aria-hidden="true">
        <canvas id="rail-wave"></canvas>
        <i></i>
      </div>
      <span class="rail-model">INMISE VX-1984 <span class="rail-model-detail">· MASTER SYSTEM</span></span>
    </footer>
  </main>

  <script src="scripts/home-terminal.js"></script>
</body>
</html>
