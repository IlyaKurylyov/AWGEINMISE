<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050706">
  <title>INMISE — Independent Audio / Video Label</title>
  <link rel="stylesheet" href="styles/home-terminal.css">
</head>
<body class="terminal-home is-booting">
  <main class="home-console" aria-label="INMISE master terminal">
    <header class="terminal-header">
      <a class="terminal-brand" href="index.html"><span></span> INMISE SYSTEM</a>
      <nav class="terminal-nav" aria-label="Main navigation">
        <a href="music"><i></i>RELEASES</a>
        <a href="artists"><i></i>ARTISTS</a>
        <a href="work"><i></i>COLLABORATION</a>
        <a href="contacts"><i></i>CONTACTS</a>
      </nav>
    </header>

    <section class="master-screen" aria-labelledby="home-title">
      <video id="home-signal" muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="assets/videos/background.mp4" type="video/mp4">
      </video>
      <div class="signal-shade" aria-hidden="true"></div>
      <div class="signal-noise" aria-hidden="true"></div>

      <span class="screen-index screen-index--left">MASTER TERMINAL / CHANNEL 01</span>
      <span class="screen-index screen-index--right"><i></i> SIGNAL ONLINE</span>

      <div class="boot-copy">
        <span class="boot-code">INDEPENDENT AUDIO / VIDEO LABEL</span>
        <h1 id="home-title" data-text="INMISE">INMISE</h1>
      </div>

      <a class="archive-handle" href="music" aria-label="Open releases archive">
        <i></i>
        <span>OPEN ARCHIVE</span>
        <b>▸</b>
      </a>

      <div class="screen-footer" aria-hidden="true">
        <span>PROPERTY OF INMISE</span>
        <span>NO SIGNAL IS EVER LOST</span>
      </div>
    </section>

    <footer class="system-rail">
      <div class="rail-power"><i></i><span>POWER</span></div>
      <div class="signal-trace" aria-hidden="true"><i></i></div>
      <span class="rail-model">INMISE VX–1984 · MASTER SYSTEM</span>
    </footer>
  </main>

  <script src="scripts/home-terminal.js"></script>
</body>
</html>
