<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030403">
  <title>INMISE — Artists</title>
  <link rel="stylesheet" href="styles/artists-signal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/config.local.js" defer></script>
  <script src="scripts/config.js" defer></script>
  <script src="scripts/artists-signal.js" defer></script>
</head>
<body class="artists-signal-page">
  <main class="artists-console" aria-label="INMISE artist signal archive">
    <img
      class="artists-console__art"
      src="assets/ui/artists-contact-sheet-approved.png"
      alt=""
      aria-hidden="true"
    >

    <nav class="console-nav" aria-label="Main navigation">
      <a class="console-nav__hotspot console-nav__hotspot--releases" href="music">
        <span class="console-nav__label">RELEASES</span>
      </a>
      <a class="console-nav__hotspot console-nav__hotspot--artists" href="artists" aria-current="page">
        <span class="console-nav__label">ARTISTS</span>
      </a>
      <a class="console-nav__hotspot console-nav__hotspot--work" href="work">
        <span class="console-nav__label">COLLABORATION</span>
      </a>
      <a class="console-nav__hotspot console-nav__hotspot--contacts" href="contacts">
        <span class="console-nav__label">CONTACTS</span>
      </a>
    </nav>

    <section class="contact-strip" id="artist-contact-strip" aria-label="Artist channels"></section>

    <section class="artist-monitor" aria-live="polite" aria-atomic="true">
      <div class="artist-monitor__media">
        <img class="artist-monitor__image artist-monitor__image--back" id="artist-hero-back" alt="">
        <img class="artist-monitor__image artist-monitor__image--front" id="artist-hero" alt="">
      </div>
      <div class="artist-monitor__identity">
        <h1 id="artist-name">SIGNAL SEARCH</h1>
        <p id="artist-channel">CHANNEL --</p>
      </div>
      <div class="artist-monitor__tracking" aria-hidden="true"></div>
    </section>

    <section class="signal-meters" id="signal-meters" aria-label="Channel level meters"></section>

    <section class="artist-description-panel" aria-live="polite">
      <p id="artist-description">SEARCHING ARTIST ARCHIVE...</p>
    </section>

    <section class="artist-socials" id="artist-socials" aria-label="Artist social links">
      <a class="artist-social artist-social--vk" data-network="vk" aria-label="VK" hidden></a>
      <a class="artist-social artist-social--tg" data-network="tg" aria-label="Telegram" hidden></a>
      <a class="artist-social artist-social--inst" data-network="inst" aria-label="Instagram" hidden></a>
    </section>

    <output class="channel-readout" id="channel-readout" aria-label="Current channel">--</output>

    <section class="transport-controls" aria-label="Artist channel controls">
      <button class="transport-control transport-control--prev" id="artist-prev" type="button">
        <span class="transport-control__cap" aria-hidden="true"></span>
        <span class="sr-only">Previous artist</span>
      </button>
      <button class="transport-control transport-control--scan" id="artist-scan" type="button">
        <span class="transport-control__cap" aria-hidden="true"></span>
        <span class="sr-only">Shuffle artists</span>
      </button>
      <button class="transport-control transport-control--select" id="artist-random" type="button">
        <span class="transport-control__cap" aria-hidden="true"></span>
        <span class="sr-only">Select a random artist</span>
      </button>
      <button class="transport-control transport-control--next" id="artist-next" type="button">
        <span class="transport-control__cap" aria-hidden="true"></span>
        <span class="sr-only">Next artist</span>
      </button>
    </section>

    <div class="signal-wave" id="signal-wave" aria-hidden="true"></div>
    <time class="signal-timecode" id="signal-timecode">00:00:00:00</time>
    <p class="load-status" id="artist-load-status" role="status">SCANNING ARCHIVE</p>
  </main>
</body>
</html>
