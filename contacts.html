<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMISE - Контакты</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/contacts.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/desktop-protection.css">
</head>
<body>
  <div class="noise-overlay"></div>
  <div class="tv-static-overlay"></div>
  <svg style="display:none;">
    <filter id="tv-wave" x="0" y="0">
      <feTurbulence id="turb" type="turbulence" baseFrequency="0.02 0.08" numOctaves="2" result="turb" seed="2"/>
      <feDisplacementMap in2="turb" in="SourceGraphic" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
    <a id="home-switch-btn" class="home-switch-btn" title="На главный экран">
      <svg width="80" height="100" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Основной корпус кнопки -->
        <rect x="22" y="2" width="56" height="96" rx="6" fill="#222" stroke="#444" stroke-width="3"/>
        <!-- Углубление для рычага -->
        <rect x="27" y="10" width="46" height="80" rx="4" fill="#181818" stroke="#111" stroke-width="2"/>
        <!-- Индикаторы -->
        <circle class="indicator-on" cx="12" cy="35" r="4" fill="#3fff3c" filter="drop-shadow(0 0 2px #3fff3c)"/>
        <circle class="indicator-off" cx="12" cy="65" r="4" fill="#ff3b3b" filter="drop-shadow(0 0 2px #ff3b3b)"/>
        <!-- Группа рычага -->
        <g class="switch-lever-group">
          <rect class="switch-lever" x="27" y="10" width="46" height="40" rx="4" fill="#333" stroke="#222" stroke-width="2"/>
          <!-- Блики на рычаге -->
          <rect x="29" y="12" width="42" height="2" rx="1" fill="#444" opacity="0.5"/>
          <rect x="29" y="46" width="42" height="2" rx="1" fill="#222" opacity="0.5" class="switch-lever"/>
          <!-- Текст -->
          <text x="50" y="32" text-anchor="middle" font-size="22" font-family="Arial" fill="#fff" font-weight="bold">I</text>
          <text x="50" y="82" text-anchor="middle" font-size="22" font-family="Arial" fill="#fff" font-weight="bold">O</text>
        </g>
      </svg>
    </a>
    <nav class="main-nav">
        <div class="nav-links">
            <a href="music.html" class="nav-link">РЕЛИЗЫ</a>
            <a href="artists.html" class="nav-link">АРТИСТЫ</a>
            <a href="work.html" class="nav-link">СОТРУДНИЧЕСТВО</a>
            <a href="contacts.html" class="nav-link active">КОНТАКТЫ</a>
        </div>
    </nav>

    <main class="content contacts-page-content">
      <section class="contacts-section">
        <div class="vhs-socials old-film">
          <div class="vhs-card">
            <div class="vhs-icon"><img src="assets/icons/telegram.svg" alt="Telegram"></div>
            <div class="vhs-title">TELEGRAM</div>
            <a href="https://t.me/inmise" target="_blank" class="vhs-btn">ПЕРЕЙТИ</a>
          </div>
          <div class="vhs-card">
            <div class="vhs-icon"><img src="assets/icons/vk.svg" alt="VK"></div>
            <div class="vhs-title">VK</div>
            <a href="https://vk.com/inmise" target="_blank" class="vhs-btn">ПЕРЕЙТИ</a>
          </div>
          <div class="vhs-card">
            <div class="vhs-icon"><img src="assets/icons/youtube.svg" alt="YouTube"></div>
            <div class="vhs-title">YOUTUBE</div>
            <a href="https://www.youtube.com/@inmiseofficial" target="_blank" class="vhs-btn">ПЕРЕЙТИ</a>
          </div>
        </div>
      </section>
    </main>

    <script src="scripts/app.js"></script>
</body>
</html>
